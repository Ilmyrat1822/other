<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>
<body>
    <form method="post" action="/login">
        {{if .error}}
            <p style="color:red;">{{.error}}</p>
        {{end}}
        <label>Your username:{{.username}}</label><br/>
        <input type="text" name="username" placeholder="username"/><br/>
        <label>Your password:{{.hashedpassword}}</label><br/>
        <input type="password" name="password" placeholder="password"/><br/><br/>
        <button type="submit" name="btn-login" style="height: 50px; width: 150px">Login
        </button><br/>
    </form>
</body>
</html>
